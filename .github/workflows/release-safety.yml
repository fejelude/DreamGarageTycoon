name: Release safety
on:
  pull_request:
  push:
    branches: [codex/release-safety-2026-10-02]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  luau:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Checkout pinned Luau compiler
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: luau-lang/luau
          ref: a25a37b54bb393d8e1d7db80852cf9842a43dbaa
          path: .ci-luau
          persist-credentials: false
      - name: Build Luau
        run: |
          cmake -S .ci-luau -B .ci-luau/build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build .ci-luau/build --target Luau.Repl.CLI Luau.Compile.CLI -j 2
      - name: Compile game scripts and run service regressions
        run: python3 tests/run.py --compiler .ci-luau/build/luau-compile --runtime .ci-luau/build/luau
